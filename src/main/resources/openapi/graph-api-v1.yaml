openapi: 3.1.0
info:
  title: Investigation Graph API
  version: 1.0.0
  description: Investigation graph API with switchable graph-query backend, smart 1-hop expansion and bounded JSON/CSV/NDJSON export. Interactive HTML export is a frontend responsibility.
servers:
  - url: /api/v1
paths:
  /graph/expand:
    post:
      summary: Smart 1-hop expansion for investigation graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphExpandRequest'
      responses:
        '200':
          description: Expanded graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExpandResponse'
        '503':
          description: DuckPGQ is required but unavailable
  /graph/full:
    get:
      summary: Return the entire canonical graph database
      description: >
        Returns every node from g_nodes and every edge from g_edges without requiring
        seeds, filters, or traversal. This endpoint is intended for frontend "show the
        whole database graph" views and does not apply maxNodes/maxEdges guardrails.
      parameters:
        - name: includeAttributes
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Entire graph database as nodes and edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExpandResponse'
  /graph/expand/preview:
    post:
      summary: Preview smart 1-hop expansion with the same filters and exclude context as expand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphExpandRequest'
      responses:
        '200':
          description: Expansion preview for UI counters and facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExpandPreviewResponse'
        '503':
          description: DuckPGQ is required but unavailable
  /graph/shortest-path:
    post:
      summary: Find shortest path between two nodes inside relation family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortestPathRequest'
      responses:
        '200':
          description: Shortest path graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortestPathResponse'
        '404':
          description: Path not found
        '503':
          description: DuckPGQ is required but unavailable
  /graph/query:
    post:
      summary: Start an investigation from a read-only SQL query
      description: >
        Executes a guarded SELECT/WITH query against canonical graph tables. In SEEDS mode
        the query must return node ids and the API expands them. In GRAPH mode the query
        may return node_id, edge_id, or source/target references and the API returns that
        graph slice without additional expansion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Query-backed investigation graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphExpandResponse'
        '400':
          description: Invalid or unsafe SQL query
        '404':
          description: Query returned no usable graph references
  /graph/import/preview:
    post:
      summary: Parse and validate a CSV graph import file without writing data
      description: >
        Accepts one CSV file containing NODE and EDGE rows. Preview returns parsed counts,
        inferred endpoint nodes, validation errors and sample rows, but does not mutate
        canonical graph tables. Non-empty numeric/date fields such as pagerank_score,
        tx_count and first_seen_at are validated and reported with rowNumber, field and
        original value when invalid; empty optional values remain allowed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GraphImportRequest'
      responses:
        '200':
          description: Import preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphImportResponse'
        '400':
          description: Invalid file or CSV format
  /graph/import/commit:
    post:
      summary: Import a CSV graph file into canonical nodes, edges and identifiers
      description: >
        Upserts nodes and edges from a CSV file into g_nodes, g_edges and g_identifiers,
        then refreshes the DuckPGQ projection so imported relations are immediately
        available to expand/query flows.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GraphImportRequest'
      responses:
        '200':
          description: Import write result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphImportResponse'
        '400':
          description: Invalid file or validation errors
  /graph/dictionary:
    get:
      summary: Get edge/status dictionary for UI legend
      responses:
        '200':
          description: Dictionary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDictionaryResponse'
  /graph/node-summary:
    get:
      summary: Get node click summary before graph expansion
      parameters:
        - name: nodeId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: relationFamily
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GraphRelationFamily'
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Direction'
            default: BOTH
      responses:
        '200':
          description: Node summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeSummaryResponse'
        '400':
          description: Blank or invalid nodeId
        '404':
          description: Node not found
  /graph/nodes/search:
    get:
      summary: Search graph nodes by name, identifier or attribute text
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: nodeType
          in: query
          required: false
          schema:
            type: string
            description: Optional node type filter, e.g. PERSON, ACCOUNT or COMPANY.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: includeAttributes
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Matching graph nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeSearchResponse'
        '400':
          description: Invalid search query or limit
  /graph/export:
    post:
      summary: Export rendered graph as JSON, CSV or NDJSON
      description: >
        Serializes the graph payload already assembled by the frontend. The backend does
        not generate interactive HTML export; frontend owns layout state, pinning, hover,
        hide-node behavior, merge UI and standalone HTML generation.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [JSON, CSV, NDJSON]
            default: JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphExportRequest'
      responses:
        '200':
          description: File payload
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
components:
  schemas:
    GraphExpandRequest:
      type: object
      required: [seeds, direction]
      properties:
        seeds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SeedRef'
        relationFamily:
          $ref: '#/components/schemas/GraphRelationFamily'
        edgeTypes:
          type: array
          maxItems: 100
          items:
            type: string
        filters:
          $ref: '#/components/schemas/GraphExpandFilters'
        exclude:
          $ref: '#/components/schemas/GraphExpandExclude'
        direction:
          $ref: '#/components/schemas/Direction'
        maxNeighborsPerSeed:
          type: integer
          minimum: 1
          maximum: 1000
        maxNodes:
          type: integer
          minimum: 1
          maximum: 1000
        maxEdges:
          type: integer
          minimum: 1
          maximum: 5000
        includeAttributes:
          type: boolean
    GraphExpandResponse:
      type: object
      required: [nodes, edges, meta]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        meta:
          $ref: '#/components/schemas/GraphMeta'
    GraphExpandFilters:
      type: object
      properties:
        relationFamilies:
          type: array
          maxItems: 100
          description: Takes priority over legacy relationFamily.
          items:
            $ref: '#/components/schemas/GraphRelationFamily'
        edgeTypes:
          type: array
          maxItems: 100
          description: Takes priority over legacy edgeTypes.
          items:
            type: string
        nodeTypes:
          type: array
          maxItems: 100
          items:
            type: string
        nodeAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GraphAttributeFilter'
        edgeAttributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GraphAttributeFilter'
    GraphAttributeFilter:
      type: object
      properties:
        eq: {}
        in:
          type: array
          items: {}
        gte:
          type: number
        lte:
          type: number
    GraphExpandExclude:
      type: object
      properties:
        nodeIds:
          type: array
          maxItems: 5000
          description: Existing canvas nodes. They are not returned in nodes[] or counted as new nodes, but new edges to them are allowed.
          items:
            type: string
        edgeIds:
          type: array
          maxItems: 5000
          description: Existing canvas edges. They are excluded from preview and expand results.
          items:
            type: string
    GraphExpandPreviewResponse:
      type: object
      required: [summary, facets, expandPreview]
      properties:
        summary:
          $ref: '#/components/schemas/GraphExpandPreviewSummary'
        facets:
          $ref: '#/components/schemas/GraphExpandFacets'
        expandPreview:
          $ref: '#/components/schemas/GraphExpandPreview'
    GraphExpandPreviewSummary:
      type: object
      required: [adjacentEdgeCount, uniqueNeighborCount, newNodeCount, newEdgeCount]
      properties:
        adjacentEdgeCount:
          type: integer
        uniqueNeighborCount:
          type: integer
        newNodeCount:
          type: integer
        newEdgeCount:
          type: integer
    GraphExpandFacets:
      type: object
      required: [relationFamilies, edgeTypes, neighborNodeTypes, nodeAttributes, edgeAttributes]
      properties:
        relationFamilies:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        edgeTypes:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        neighborNodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        nodeAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GraphFacetCount'
        edgeAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GraphFacetCount'
    GraphQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          minLength: 1
          maxLength: 10000
          description: Single read-only SELECT/WITH statement over canonical graph tables.
        resultMode:
          $ref: '#/components/schemas/GraphQueryResultMode'
          default: SEEDS
        relationFamily:
          $ref: '#/components/schemas/GraphRelationFamily'
        edgeTypes:
          type: array
          maxItems: 100
          items:
            type: string
        direction:
          $ref: '#/components/schemas/Direction'
          default: BOTH
        maxNeighborsPerSeed:
          type: integer
          minimum: 1
          maximum: 1000
        maxNodes:
          type: integer
          minimum: 1
          maximum: 1000
        maxEdges:
          type: integer
          minimum: 1
          maximum: 5000
        includeAttributes:
          type: boolean
    GraphQueryResultMode:
      type: string
      enum: [SEEDS, GRAPH]
    GraphImportRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: UTF-8 CSV file, max 10 MiB.
    GraphImportResponse:
      type: object
      required:
        - fileName
        - status
        - parsedNodeCount
        - parsedEdgeCount
        - inferredNodeCount
        - invalidRowCount
        - insertedNodeCount
        - updatedNodeCount
        - insertedEdgeCount
        - updatedEdgeCount
        - errors
        - warnings
        - sampleRows
      properties:
        fileName:
          type: string
        status:
          type: string
          enum: [PREVIEW, COMMITTED]
        parsedNodeCount:
          type: integer
        parsedEdgeCount:
          type: integer
        inferredNodeCount:
          type: integer
        invalidRowCount:
          type: integer
        insertedNodeCount:
          type: integer
        updatedNodeCount:
          type: integer
        insertedEdgeCount:
          type: integer
        updatedEdgeCount:
          type: integer
        errors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GraphImportError'
        warnings:
          type: array
          items:
            type: string
        sampleRows:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties:
              type: string
    GraphImportError:
      type: object
      required: [rowNumber, section, message]
      properties:
        rowNumber:
          type: integer
        section:
          type: string
          enum: [ROW, NODE, EDGE]
        field:
          type:
            - string
            - 'null'
          description: CSV field that failed validation, when the error is field-specific.
        value:
          type:
            - string
            - 'null'
          description: Original CSV value that failed validation, truncated to 128 characters.
        message:
          type: string
    ShortestPathRequest:
      type: object
      required: [source, target, direction]
      properties:
        source:
          $ref: '#/components/schemas/SeedRef'
        target:
          $ref: '#/components/schemas/SeedRef'
        relationFamily:
          $ref: '#/components/schemas/GraphRelationFamily'
        direction:
          $ref: '#/components/schemas/Direction'
        maxDepth:
          type: integer
          minimum: 1
          maximum: 10
    ShortestPathResponse:
      type: object
      required: [path, nodes, edges, meta]
      properties:
        path:
          $ref: '#/components/schemas/Path'
        nodes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/GraphEdge'
        meta:
          $ref: '#/components/schemas/GraphMeta'
    GraphExportRequest:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/GraphEdge'
        meta:
          $ref: '#/components/schemas/GraphMeta'
    GraphNodeSummaryResponse:
      type: object
      required: [node, summary, relationFamilies, edgeTypes, neighborNodeTypes, expandPreview]
      properties:
        node:
          $ref: '#/components/schemas/GraphNode'
        summary:
          $ref: '#/components/schemas/GraphNodeSummary'
        relationFamilies:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        edgeTypes:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        neighborNodeTypes:
          type: array
          items:
            $ref: '#/components/schemas/GraphFacetCount'
        expandPreview:
          $ref: '#/components/schemas/GraphExpandPreview'
    GraphNodeSearchResponse:
      type: object
      required: [nodes, meta]
      properties:
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GraphNode'
        meta:
          $ref: '#/components/schemas/GraphNodeSearchMeta'
    GraphNodeSearchMeta:
      type: object
      required: [query, limit, returnedNodeCount, truncated]
      properties:
        query:
          type: string
        nodeType:
          type:
            - string
            - 'null'
        limit:
          type: integer
        returnedNodeCount:
          type: integer
        truncated:
          type: boolean
    GraphDictionaryResponse:
      type: object
      required: [edgeTypes, relationFamilies, nodeTypes, nodeStatuses, styleHints]
      properties:
        edgeTypes:
          type: array
          items:
            type: string
        relationFamilies:
          type: array
          items:
            type: string
        nodeTypes:
          type: array
          items:
            type: string
        nodeStatuses:
          type: array
          items:
            type: string
        styleHints:
          type: object
          additionalProperties:
            type: string
    GraphNodeSummary:
      type: object
      required: [requestedDirection, relationFamily, adjacentEdgeCount, uniqueNeighborCount, outboundEdgeCount, inboundEdgeCount]
      properties:
        requestedDirection:
          $ref: '#/components/schemas/Direction'
        relationFamily:
          type: string
        adjacentEdgeCount:
          type: integer
        uniqueNeighborCount:
          type: integer
        outboundEdgeCount:
          type: integer
        inboundEdgeCount:
          type: integer
    GraphFacetCount:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
    GraphExpandPreview:
      type: object
      required: [defaultMaxNeighborsPerSeed, defaultMaxNodes, defaultMaxEdges, wouldTruncateByNeighborBudget]
      properties:
        defaultMaxNeighborsPerSeed:
          type: integer
        defaultMaxNodes:
          type: integer
        defaultMaxEdges:
          type: integer
        wouldTruncateByNeighborBudget:
          type: boolean
    SeedRef:
      type: object
      required: [type, value]
      properties:
        type:
          $ref: '#/components/schemas/SeedType'
        value:
          type: string
          minLength: 1
    SeedType:
      type: string
      description: Identifier type stored in `g_identifiers`; aliases like `id`, `party`, or `phone` are accepted by the API.
    GraphRelationFamily:
      type: string
      description: Relation family value stored in `g_edges.relation_family`; `ALL_RELATIONS` disables family filtering.
    Direction:
      type: string
      enum: [OUTBOUND, INBOUND, BOTH]
    GraphNode:
      type: object
      required: [nodeId, displayName]
      properties:
        nodeId:
          type: string
          minLength: 1
        nodeType:
          type: string
        displayName:
          type: string
          minLength: 1
        identifiers:
          type: object
          additionalProperties:
            type: string
        statuses:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
    GraphEdge:
      type: object
      required: [edgeId, fromNodeId, toNodeId, type, directed]
      properties:
        edgeId:
          type: string
          minLength: 1
        fromNodeId:
          type: string
          minLength: 1
        toNodeId:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        relationFamily:
          type: string
        directed:
          type: boolean
        weight:
          type: number
        sourceSystem:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true
    GraphMeta:
      type: object
      required: [truncated, executionMs, source, relationFamily, rankingStrategy, candidateEdgeCount, returnedNodeCount, returnedEdgeCount, warnings]
      properties:
        truncated:
          type: boolean
        executionMs:
          type: integer
        source:
          type: string
          enum: [DUCKPGQ, NEO4J, MEMGRAPH, POSTGRES_AGE, ARANGODB, JANUSGRAPH, KUZU]
        relationFamily:
          $ref: '#/components/schemas/GraphRelationFamily'
        rankingStrategy:
          type: string
        candidateEdgeCount:
          type: integer
        returnedNodeCount:
          type: integer
        returnedEdgeCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
    Path:
      type: object
      required: [orderedNodeIds, orderedEdgeIds, hopCount]
      properties:
        orderedNodeIds:
          type: array
          items:
            type: string
        orderedEdgeIds:
          type: array
          items:
            type: string
        hopCount:
          type: integer
